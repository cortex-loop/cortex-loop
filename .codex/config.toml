service_tier = "fast"

[features]
codex_hooks = true

[[hooks.Stop]]
[[hooks.Stop.hooks]]
type = "command"
command = 'python3 "$(git rev-parse --show-toplevel)/.codex/hooks/cortex_mission_reflection_stop_hook.py"'
timeout = 120
statusMessage = "Checking Cortex Mission Reflection"

[agents]
max_threads = 3
max_depth = 1
job_max_runtime_seconds = 1200
