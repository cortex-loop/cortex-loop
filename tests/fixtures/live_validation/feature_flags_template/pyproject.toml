[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "feature-flags-template"
version = "0.0.0"
description = "Deterministic feature-flag evaluator for Cortex verified-work breadth"
requires-python = ">=3.11"

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
