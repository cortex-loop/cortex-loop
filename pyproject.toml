[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cortex"
version = "0.0.0"
description = "Cortex executive layer for model runtime control."
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
cortex-openai-cli = "cortex.runtime.openai_cli:main"
cortex-openai-service = "cortex.runtime.openai_service:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["cortex", "cortex.*"]
exclude = ["experimental", "experimental.*", "lab", "lab.*", "internal", "internal.*", "tests", "tests.*"]
